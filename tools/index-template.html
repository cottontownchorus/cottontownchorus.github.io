<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cottontown Rehearsals</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#140b0d);--ink:light-dark(#1b1416,#f3ecee);--soft:light-dark(#6b5d61,#b9a9ae);--line:light-dark(#eadfe2,#3a2a2f);--red:#b3122e;--redink:light-dark(#b3122e,#ff6b84)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Archivo,system-ui,sans-serif}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}.wrap{max-width:900px;margin:0 auto}
.top{background:var(--red);color:#fff}
h1{font-weight:800;font-size:clamp(32px,5vw,52px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px}
.top p{margin:0;opacity:.95}
ul{list-style:none;margin:0;padding:0}
li a{display:flex;justify-content:space-between;gap:16px;align-items:baseline;padding:18px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
li a:hover b,li a:focus-visible b{color:var(--redink)}
b{font-weight:800;font-size:clamp(20px,2.4vw,26px)}
span{color:var(--soft);white-space:nowrap}
</style></head><body>
<header class="band top"><div class="wrap"><h1>Cottontown rehearsals</h1><p>Every rehearsal, with notes and a timestamp for every moment. Newest first.</p></div></header>
<main class="band"><div class="wrap"><ul>
<!--LIST-->
</ul></div></main>
</body></html>
